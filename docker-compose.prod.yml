# Produktions-Compose für die EC2-Instanz (CAT-27).
# Läuft auf /opt/ctf, .env kommt aus SSM via deploy/refresh-env.sh.
services:
  ctf-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: ctf-web
    ports:
      - "80:8000"
    env_file: .env
    restart: unless-stopped
    volumes:
      - ctf-db:/data          # DATABASE_URL zeigt auf /data/cut_the_fat.db
      - ctf-data:/opt/ctf/data # Upload-Tmp, überlebt Redeploys

volumes:
  ctf-db:
  ctf-data:
